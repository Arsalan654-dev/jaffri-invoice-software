<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Demo ERP</title>
  <link rel="icon" type="image/svg+xml" href="vite.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();

    var bodyHtml =
      '<div class="dashboard">' +
      '  <div class="welcome-section">' +
      '    <div class="welcome-text">' +
      '      <h1>Welcome back, admin! 👋</h1>' +
      '      <p>Here\'s what\'s happening with your accounts today.</p>' +
      '    </div>' +
      '    <div class="welcome-actions">' +
      '      <a href="invoices.html" class="btn btn-primary" data-icon="plus"><span>New Invoice</span></a>' +
      '      <a href="reports.html" class="btn btn-secondary" data-icon="chart"><span>View Reports</span></a>' +
      '    </div>' +
      '  </div>' +

      '  <div class="stats-grid">' +
      '    <div class="stat-card receivable">' +
      '      <div class="stat-icon" data-icon="cash"></div>' +
      '      <div class="stat-info">' +
      '        <div class="stat-label">Accounts Receivable</div>' +
      '        <div class="stat-value">Rs. 0.00</div>' +
      '        <div class="stat-trend positive">+12.5% vs last month</div>' +
      '      </div>' +
      '    </div>' +
      '    <div class="stat-card payable">' +
      '      <div class="stat-icon" data-icon="wallet"></div>' +
      '      <div class="stat-info">' +
      '        <div class="stat-label">Accounts Payable</div>' +
      '        <div class="stat-value">Rs. 0.00</div>' +
      '        <div class="stat-trend negative">-3.2% vs last month</div>' +
      '      </div>' +
      '    </div>' +
      '    <div class="stat-card customers">' +
      '      <div class="stat-icon" data-icon="customers"></div>' +
      '      <div class="stat-info">' +
      '        <div class="stat-label">Total Customers</div>' +
      '        <div class="stat-value">0</div>' +
      '        <div class="stat-trend positive">+4 new this week</div>' +
      '      </div>' +
      '    </div>' +
      '    <div class="stat-card inventory">' +
      '      <div class="stat-icon" data-icon="box"></div>' +
      '      <div class="stat-info">' +
      '        <div class="stat-label">Inventory Items</div>' +
      '        <div class="stat-value">0</div>' +
      '        <div class="stat-trend">2 items low in stock</div>' +
      '      </div>' +
      '    </div>' +
      '  </div>' +

      '  <div class="charts-grid">' +
      '    <div class="chart-card">' +
      '      <h3>Invoice Status Distribution</h3>' +
      '      <div style="height:300px;position:relative"><canvas id="statusChart"></canvas></div>' +
      '    </div>' +
      '    <div class="chart-card">' +
      '      <h3>Recent Invoices</h3>' +
      '      <div class="recent-invoices">' +
      '        <div class="empty-state">' +
      '          <div class="empty-icon" data-icon="file"></div>' +
      '          <h3>No invoices yet</h3>' +
      '          <p>Create your first invoice to see it here.</p>' +
      '        </div>' +
      '      </div>' +
      '    </div>' +
      '  </div>' +
      '</div>';

    renderLayoutWith({ title: 'Dashboard', active: 'dashboard' }, bodyHtml);

    // ===== Live data from localStorage =====
    function getInv() { try { return JSON.parse(localStorage.getItem('erp_invoices')) || []; } catch (e) { return []; } }
    function getCust() { try { return JSON.parse(localStorage.getItem('erp_customers')) || []; } catch (e) { return []; } }
    function getItems() { try { return JSON.parse(localStorage.getItem('erp_items')) || []; } catch (e) { return []; } }
    function getEntries() { try { return JSON.parse(localStorage.getItem('erp_entries')) || []; } catch (e) { return []; } }

    var invoices = getInv();
    var receivable = 0, payable = 0;
    invoices.forEach(function (inv) {
      var due = inv.total - (inv.paid || 0);
      if (inv.type === 'receivable') receivable += due;
      else payable += due;
    });

    // Update stat cards
    var cardEls = document.querySelectorAll('.stat-card');
    if (cardEls[0]) cardEls[0].querySelector('.stat-value').textContent = formatMoney(receivable);
    if (cardEls[1]) cardEls[1].querySelector('.stat-value').textContent = formatMoney(payable);
    if (cardEls[2]) cardEls[2].querySelector('.stat-value').textContent = getCust().length;
    if (cardEls[3]) cardEls[3].querySelector('.stat-value').textContent = getItems().length;

    // Recent invoices list
    var recent = [];
    try { recent = JSON.parse(localStorage.getItem('erp_invoices')) || []; } catch (e) {}
    var recentBox = document.querySelector('.recent-invoices');
    if (recentBox) {
      if (recent.length === 0) {
        recentBox.innerHTML =
          '<div class="empty-state">' +
          '  <div class="empty-icon" data-icon="file"></div>' +
          '  <h3>No invoices yet</h3>' +
          '  <p>Create your first invoice to see it here.</p>' +
          '</div>';
      } else {
        var rh = '';
        recent.slice(0, 5).forEach(function (inv) {
          rh += '<div class="invoice-item">' +
            '<div class="invoice-info">' +
            '<span class="invoice-number">' + inv.number + ' · ' + inv.party + '</span>' +
            '<span class="text-muted-c" style="font-size:.8rem">' + inv.date + ' · ' + inv.status + '</span>' +
            '</div>' +
            '<span class="invoice-amount">' + formatMoney(inv.total) + '</span>' +
            '</div>';
        });
        recentBox.innerHTML = rh;
      }
      injectIcons(recentBox);
    }

    // Invoice status chart with real data
    var statusCount = { paid: 0, pending: 0, partial: 0, overdue: 0 };
    invoices.forEach(function (inv) {
      if (inv.status && statusCount[inv.status] !== undefined) statusCount[inv.status]++;
    });
    var entriesForChart = [statusCount.paid, statusCount.pending, statusCount.partial, statusCount.overdue];

    var ctx = document.getElementById('statusChart');
    if (ctx && typeof Chart !== 'undefined') {
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Paid', 'Pending', 'Partial', 'Overdue'],
          datasets: [{
            data: entriesForChart,
            backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#ef4444'],
            borderWidth: 0,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: { family: 'Plus Jakarta Sans', weight: 600, size: 13 } } }
          },
          cutout: '60%'
        }
      });
    }
  </script>
</body>
</html>
