<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaffri Invoice Software | Login</title>
  <link rel="icon" type="image/png" href="images/jaffri-invoice-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="images/jaffri-invoice-icon.png" alt="" width="64" height="64" style="display:block;margin:0 auto 10px;">
        <h1>Jaffri Invoice Software</h1>
        <p>Sign in to your account</p>
      </div>
      <form class="login-form" id="loginForm" autocomplete="off">
        <div id="loginError" class="error-message" style="display:none"></div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      </form>
      <div class="login-footer">
        <button class="btn-link" type="button" onclick="signUpAsDemo()">Don't have an account? Sign Up</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Sign Up logs in as demo admin (matches original demo behavior)
    function signUpAsDemo() {
      localStorage.setItem('erp_mirror_auth', 'true');
      localStorage.setItem('erp_user_email', 'demo@jaffri-invoice.test');
      window.location.href = 'dashboard.html';
    }
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errEl = document.getElementById('loginError');
      if (!email || !password) {
        errEl.textContent = 'Please enter email and password.';
        errEl.style.display = 'block';
        return;
      }
      if (doLogin(email, password)) {
        window.location.href = 'dashboard.html';
      } else {
        errEl.textContent = 'Invalid credentials. Please try again.';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
