<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendors | Demo ERP</title>
  <link rel="icon" type="image/svg+xml" href="vite.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();

    var bodyHtml =
      '<div class="vendors-page">' +
      '  <div class="page-header">' +
      '    <h2>Vendors</h2>' +
      '    <button class="btn btn-primary" data-icon="plus" onclick="openModal(\'vendorModal\')"><span>Add Vendor</span></button>' +
      '  </div>' +
      '  <div class="table-container">' +
      '    <table class="data-table">' +
      '      <thead>' +
      '        <tr><th>Name</th><th>Email</th><th>Phone</th><th>Current Balance</th><th>Actions</th></tr>' +
      '      </thead>' +
      '      <tbody id="vendorsBody">' +
      '        <tr><td colspan="5" class="empty-message text-center">No vendors yet. Click "Add Vendor" to create one.</td></tr>' +
      '      </tbody>' +
      '    </table>' +
      '  </div>' +
      '</div>' +

      '<!-- Add Vendor Modal -->' +
      '<div class="modal-overlay" id="vendorModal">' +
      '  <div class="modal">' +
      '    <div class="modal-header">' +
      '      <h3>Add Vendor</h3>' +
      '      <button class="close-btn" onclick="closeModal(\'vendorModal\')">&times;</button>' +
      '    </div>' +
      '    <form onsubmit="saveVendor(event)">' +
      '      <div class="form-row">' +
      '        <div class="form-group"><label>Name</label><input type="text" id="vendorName" required placeholder="Vendor name"></div>' +
      '        <div class="form-group"><label>Phone</label><input type="text" id="vendorPhone" placeholder="+92 3xx xxxxxxx"></div>' +
      '      </div>' +
      '      <div class="form-row">' +
      '        <div class="form-group"><label>Email</label><input type="email" id="vendorEmail" placeholder="vendor@email.com"></div>' +
      '        <div class="form-group"><label>Opening Balance</label><input type="number" id="vendorBalance" value="0" step="0.01"></div>' +
      '      </div>' +
      '      <div class="modal-actions">' +
      '        <button type="button" class="btn btn-secondary" onclick="closeModal(\'vendorModal\')">Cancel</button>' +
      '        <button type="submit" class="btn btn-primary">Save Vendor</button>' +
      '      </div>' +
      '    </form>' +
      '  </div>' +
      '</div>';

    renderLayoutWith({ title: 'Vendors', subtitle: 'Manage your project dashboard and performance', active: 'vendors' }, bodyHtml);

    var VENDORS_KEY = 'erp_vendors';
    function getVendors() {
      try { return JSON.parse(localStorage.getItem(VENDORS_KEY)) || []; } catch (e) { return []; }
    }
    function saveVendors(list) { localStorage.setItem(VENDORS_KEY, JSON.stringify(list)); }

    function renderVendors() {
      var list = getVendors();
      var tbody = document.getElementById('vendorsBody');
      if (!tbody) return;
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-message text-center">No vendors yet. Click "Add Vendor" to create one.</td></tr>';
        return;
      }
      var html = '';
      list.forEach(function (v, i) {
        html += '<tr>' +
          '<td>' + escapeHtml(v.name) + '</td>' +
          '<td>' + escapeHtml(v.email || '—') + '</td>' +
          '<td>' + escapeHtml(v.phone || '—') + '</td>' +
          '<td class="amount">' + formatMoney(v.balance) + '</td>' +
          '<td>' +
          '  <div class="action-buttons d-flex gap-2">' +
          '    <button class="btn-icon" title="Edit" onclick="editVendor(' + i + ')" data-icon="edit"></button>' +
          '    <button class="btn-icon danger" title="Delete" onclick="deleteVendor(' + i + ')" data-icon="trash"></button>' +
          '  </div>' +
          '</td>' +
          '</tr>';
      });
      tbody.innerHTML = html;
      injectIcons(tbody);
    }

    window.saveVendor = function (e) {
      e.preventDefault();
      var list = getVendors();
      list.push({
        name: document.getElementById('vendorName').value.trim(),
        phone: document.getElementById('vendorPhone').value.trim(),
        email: document.getElementById('vendorEmail').value.trim(),
        balance: parseFloat(document.getElementById('vendorBalance').value) || 0
      });
      saveVendors(list);
      closeModal('vendorModal');
      renderVendors();
      showToast('Vendor added successfully!');
    };

    window.deleteVendor = function (i) {
      var list = getVendors();
      list.splice(i, 1);
      saveVendors(list);
      renderVendors();
      showToast('Vendor deleted.', 'error');
    };

    window.editVendor = function (i) {
      var list = getVendors();
      var v = list[i];
      if (!v) return;
      document.getElementById('vendorName').value = v.name;
      document.getElementById('vendorPhone').value = v.phone || '';
      document.getElementById('vendorEmail').value = v.email || '';
      document.getElementById('vendorBalance').value = v.balance;
      openModal('vendorModal');
    };

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    renderVendors();
  </script>
</body>
</html>
