<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Orders | Jaffri Invoice Software</title>
  <link rel="icon" type="image/png" href="images/jaffri-invoice-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    requireAuth();

    var bodyHtml =
      '<div class="purchase-orders-page">' +
      '  <div class="page-header">' +
      '    <h2>Purchase Orders</h2>' +
      '    <button class="btn btn-primary" data-icon="plus" onclick="openModal(\'poModal\')"><span>New PO</span></button>' +
      '  </div>' +
      '  <div class="table-container">' +
      '    <table class="data-table">' +
      '      <thead>' +
      '        <tr><th>PO Number</th><th>Date</th><th>Vendor</th><th>Amount</th><th>Status</th><th>Actions</th></tr>' +
      '      </thead>' +
      '      <tbody id="posBody">' +
      '        <tr><td colspan="6" class="empty-message text-center">No purchase orders yet. Click "New PO" to create one.</td></tr>' +
      '      </tbody>' +
      '    </table>' +
      '  </div>' +
      '</div>' +

      '<!-- New PO Modal -->' +
      '<div class="modal-overlay" id="poModal">' +
      '  <div class="modal">' +
      '    <div class="modal-header">' +
      '      <h3>New Purchase Order</h3>' +
      '      <button class="close-btn" onclick="closeModal(\'poModal\')">&times;</button>' +
      '    </div>' +
      '    <form onsubmit="savePO(event)">' +
      '      <div class="form-row">' +
      '        <div class="form-group"><label>Vendor</label>' +
      '          <select id="poVendor"><option value="">-- Select Vendor --</option></select>' +
      '        </div>' +
      '        <div class="form-group"><label>PO Date</label><input type="date" id="poDate"></div>' +
      '      </div>' +
      '      <div class="form-group"><label>Amount</label><input type="number" id="poAmount" value="0" step="0.01"></div>' +
      '      <div class="form-group" style="margin-top:24px"><label>Notes</label><textarea id="poNotes" rows="3" placeholder="Optional notes..."></textarea></div>' +
      '      <div class="modal-actions">' +
      '        <button type="button" class="btn btn-secondary" onclick="closeModal(\'poModal\')">Cancel</button>' +
      '        <button type="submit" class="btn btn-primary">Create PO</button>' +
      '      </div>' +
      '    </form>' +
      '  </div>' +
      '</div>';

    renderLayoutWith({ title: 'Purchase Orders', subtitle: 'Manage your project dashboard and performance', active: 'purchase-orders' }, bodyHtml);

    var PO_KEY = 'erp_pos';
    function getPOs() {
      try { return JSON.parse(localStorage.getItem(PO_KEY)) || []; } catch (e) { return []; }
    }
    function savePOs(list) { localStorage.setItem(PO_KEY, JSON.stringify(list)); }

    function loadVendors() {
      var sel = document.getElementById('poVendor');
      if (!sel) return;
      var vendors = [];
      try { vendors = JSON.parse(localStorage.getItem('erp_vendors')) || []; } catch (e) {}
      var html = '<option value="">-- Select Vendor --</option>';
      vendors.forEach(function (v) { html += '<option value="' + v.name + '">' + v.name + '</option>'; });
      sel.innerHTML = html;
    }

    function renderPOs() {
      var list = getPOs();
      var tbody = document.getElementById('posBody');
      if (!tbody) return;
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-message text-center">No purchase orders yet. Click "New PO" to create one.</td></tr>';
        return;
      }
      var html = '';
      list.forEach(function (po, i) {
        html += '<tr>' +
          '<td class="font-bold">' + po.number + '</td>' +
          '<td>' + po.date + '</td>' +
          '<td>' + po.vendor + '</td>' +
          '<td class="amount">' + formatMoney(po.amount) + '</td>' +
          '<td><span class="status-badge pending">' + po.status + '</span></td>' +
          '<td>' +
          '  <div class="action-buttons d-flex gap-2">' +
          '    <button class="btn-icon danger" title="Delete" onclick="deletePO(' + i + ')" data-icon="trash"></button>' +
          '  </div>' +
          '</td>' +
          '</tr>';
      });
      tbody.innerHTML = html;
      injectIcons(tbody);
    }

    window.savePO = function (e) {
      e.preventDefault();
      var vendor = document.getElementById('poVendor').value;
      if (!vendor) {
        showToast('Please select a vendor.', 'error');
        return;
      }
      var today = new Date().toISOString().split('T')[0];
      var list = getPOs();
      var number = 'PO-' + String(list.length + 1).padStart(3, '0');
      list.push({
        number: number,
        date: document.getElementById('poDate').value || today,
        vendor: vendor,
        amount: parseFloat(document.getElementById('poAmount').value) || 0,
        status: 'pending',
        notes: document.getElementById('poNotes').value
      });
      savePOs(list);
      closeModal('poModal');
      renderPOs();
      showToast('PO ' + number + ' created!');
    };

    window.deletePO = function (i) {
      var list = getPOs();
      list.splice(i, 1);
      savePOs(list);
      renderPOs();
      showToast('Purchase order deleted.', 'error');
    };

    loadVendors();
    renderPOs();
  </script>
</body>
</html>
